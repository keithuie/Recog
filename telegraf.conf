[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "machineiq-gateway"
  omit_hostname = false

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "machineiq_data"
  username = "admin"
  password = "machineiq_secure_pass"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "machineiq/analysis/result",
    "machineiq/system/status"
  ]
  data_format = "json"
  # Define how to parse JSON fields
  json_string_fields = ["pattern", "status"]
  tag_keys = ["device_id", "sensor_id"]
