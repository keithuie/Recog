version: '3.8'

services:
  # 1. Verification Database
  influxdb:
    image: influxdb:1.8
    container_name: machineiq_influx
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=machineiq_data
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=machineiq_secure_pass
    networks:
      - machineiq-net

  # 2. Visualization Dashboard
  grafana:
    image: grafana/grafana-oss:latest
    container_name: machineiq_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Allow unsigned plugins (Crucial for local development)
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=machineiq-pattern-panel
    depends_on:
      - influxdb
    volumes:
      # Mount your local build folder to the container
      - ./machineiq-panel/dist:/var/lib/grafana/plugins/machineiq-pattern-panel
      # Persist Grafana storage
      - grafana_storage:/var/lib/grafana
    networks:
      - machineiq-net

  # 3. MQTT Broker (Control Plane)
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: machineiq_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - machineiq-net

networks:
  machineiq-net:
    driver: bridge

volumes:
  grafana_storage:
