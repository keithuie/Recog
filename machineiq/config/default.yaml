# MachineIQ Default Configuration
# ================================

# CMM Detector Settings
cmm:
  # Number of bins for discretizing each feature channel
  # Higher values = more precision, but more memory
  bins_per_channel: 64

  # Binning method for converting continuous values to binary
  # Options: uniform, quantile, kmeans
  # - uniform: Equal-width bins (good for normally distributed data)
  # - quantile: Equal-frequency bins (better for skewed data)
  # - kmeans: Cluster-based bins (good for multimodal data)
  binning_method: quantile

  # Correlation threshold for anomaly detection
  # Values below this threshold are flagged as anomalies
  # Range: 0.0 to 1.0 (higher = stricter)
  # Note: For high-dimensional features (>20), use lower values (0.2-0.4)
  correlation_threshold: 0.35

# Feature Extraction Settings
features:
  vibration:
    # Sampling rate of vibration signals (Hz)
    sample_rate: 10000

    # Number of FFT frequency bins
    fft_bins: 32

    # Maximum frequency to analyze (Hz)
    # null = use Nyquist frequency (sample_rate / 2)
    max_freq: null

    # Include bearing fault frequency features
    include_bearing_freqs: true

    # Number of harmonics to extract for bearing frequencies
    n_harmonics: 3

# Memory Bank Settings
memory:
  # Path to SQLite database
  # Use ":memory:" for in-memory storage (testing only)
  db_path: ./data/memory.db

# Hybrid Engine Settings
engine:
  # Enable CMM detector (Phase 1)
  enable_cmm: true

  # Enable Autoencoder detector (Phase 2 - not yet implemented)
  enable_autoencoder: false

  # Enable LSTM detector (Phase 2 - not yet implemented)
  enable_lstm: false

  # Detector weights for ensemble combination
  # Weights are normalized, so only relative values matter
  weights:
    cmm: 1.0

# Logging Settings
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: INFO

  # Log file path (null = console only)
  file: null

# Performance Settings
performance:
  # Batch size for processing
  batch_size: 100

  # Maximum memory usage for CMM matrix (MB)
  # Set to null for no limit
  max_memory_mb: 500
